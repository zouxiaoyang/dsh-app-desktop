name: Build macOS DMG

# 手动触发，或推送 v* 标签时自动触发（自动发布到对应 Release）
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    # macos-14 runner = Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - name: Check architecture
        run: uname -m

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install app dependencies
        run: npm install

      - name: Clone DeepSeek Harness (public, MIT)
        run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git dsh-src

      - name: Install DSH dependencies
        run: cd dsh-src && pnpm install

      - name: Build staged server + app (arm64)
        run: DSH_REPO=$PWD/dsh-src npm run build

      - name: Package DMG
        run: npx electron-builder --mac dmg

      - name: Verify architecture
        run: |
          file dist/mac/DSH.app/Contents/MacOS/DSH
          ls -la dist/*.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-dmg-arm64
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish to GitHub Release (tag-triggered only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          ARM_DMG="dist/DSH-${VER}-arm64.dmg"
          mv dist/DSH-${VER}.dmg "$ARM_DMG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARM_DMG" --clobber
          else
            gh release create "$TAG" "$ARM_DMG" --title "$TAG" \
              --notes "Apple Silicon (arm64) build — 自动构建于 GitHub Actions"
          fi
